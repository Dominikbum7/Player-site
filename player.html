<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>PlayerJS Video</title>
  <!-- Подключение скрипта плеера -->
  <script src="https://cdn.jsdelivr.net/gh/playerjs/playerjs@latest/playerjs.js"></script>
</head>
<body>
  <!-- Контейнер для плеера -->
  <div id="player"></div>

  <!-- Инициализация плеера -->
  <script>
    var player = new Playerjs({
      id: "player",
      file: "https://pixeldrain.com/api/file/oweXa4SG"
    });
  </script>
</body>
</html>
