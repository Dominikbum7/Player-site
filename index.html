<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Видео</title>
  <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #000;
    }

    .video-container {
      width: 100%;
      height: 100vh;
      background-color: #000;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background-color: #000;
      display: block;
    }

    .plyr__control {
      background: linear-gradient(135deg, #ff0000, #000000) !important;
      border: none !important;
    }

    /* Стили для фуллскрина */
    :fullscreen .video-container,
    :-webkit-full-screen .video-container,
    :-moz-full-screen .video-container,
    :-ms-fullscreen .video-container {
      width: 100vw;
      height: 100vh;
    }

    :fullscreen video,
    :-webkit-full-screen video,
    :-moz-full-screen video,
    :-ms-fullscreen video {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <div class="video-container">
    <video id="player" playsinline controls autoplay>
      <source src="https://pixeldrain.com/api/file/WKgtGoCU" type="video/mp4" />
      Ваш браузер не поддерживает HTML5 видео.
    </video>
  </div>

  <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
  <script>
    const player = new Plyr('#player', {
      fullscreen: {
        enabled: true,
        fallback: true,
        iosNative: false
      }
    });
  </script>
</body>
</html>
